plugins {
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'arin.Arin'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Existing regression checks are standalone Java programs, not JUnit methods.
    failOnNoDiscoveredTests = false
}
