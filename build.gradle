plugins {
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'arin.Launcher'
}

dependencies {
    String javaFxVersion = '17.0.7'
    // Mac native libraries share filenames, so bundle the build machine's architecture.
    String javaFxMacPlatform = System.getProperty('os.arch') == 'aarch64' ? 'mac-aarch64' : 'mac'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:${javaFxMacPlatform}")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:${javaFxMacPlatform}")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxMacPlatform}")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxMacPlatform}")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Existing regression checks are standalone Java programs, not JUnit methods.
    failOnNoDiscoveredTests = false
}
